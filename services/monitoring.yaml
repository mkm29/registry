services:
  # Metrics Backend
  mimir-1:
    image: grafana/mimir:3.0.3
    container_name: mimir-1
    env_file: [../secrets/all.env.dec]
    volumes:
      - ../config/mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    environment:
      - AWS_ACCESS_KEY_ID=${MIMIR_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MIMIR_S3_SECRET_KEY}
    networks: [monitoring]

  # Log Aggregator
  loki:
    image: grafana/loki:3.6.7
    container_name: loki
    env_file: [../secrets/all.env.dec]
    volumes:
      - ../config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    environment:
      - AWS_ACCESS_KEY_ID=${LOKI_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${LOKI_S3_SECRET_KEY}
    networks: [monitoring]

  # Trace Backend
  tempo:
    image: grafana/tempo:2.10.1
    container_name: tempo
    env_file: [../secrets/all.env.dec]
    volumes:
      - ../shared/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    environment:
      - AWS_ACCESS_KEY=${TEMPO_S3_ACCESS_KEY}
      - AWS_SECRET_KEY=${TEMPO_S3_SECRET_KEY}
    networks: [monitoring]

  # Telemetry Agent
  alloy:
    image: grafana/alloy:v1.14.0
    container_name: alloy
    restart: unless-stopped
    volumes:
      - /run/user/1000/podman.sock:/var/run/docker.sock:ro
      - ../config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - traefik-logs:/var/log/traefik:ro
    tmpfs:
      - /var/lib/alloy/data:size=512M
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    env_file: [../secrets/all.env.dec]
    networks: [monitoring, registry]

  # Container Metrics (Rootless Optimized)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro
      - /run/user/1000:/run/user/1000:ro
      - ${HOME}/.local/share/docker/:/var/lib/docker:ro
    command:
      - --docker=unix:///run/user/1000/podman.sock
      - --docker_only=true
      - --store_container_labels=true
    networks: [monitoring]

  # Log Viewer
  dozzle:
    image: amir20/dozzle:v9
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /run/user/1000/podman.sock:/var/run/docker.sock:ro
    tmpfs:
      - /data:size=256M
    ports: ["9080:9080"]
    networks: [monitoring]

  # Visualization
  grafana:
    image: grafana/grafana:12.4
    container_name: grafana
    volumes: [grafana-data:/var/lib/grafana]
    networks: [monitoring, proxy]
    labels:
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"

volumes:
  traefik-logs:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/monitoring/logs/traefik
      o: bind
  loki-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/monitoring/logs/loki
      o: bind
  mimir-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/monitoring/metrics
      o: bind
  tempo-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/monitoring/traces
      o: bind
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/data/grafana
      o: bind
