services:
  postgresql:
    image: postgres:16-alpine
    container_name: auth-db
    env_file: [../secrets/all.env.dec]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - auth

  redis:
    image: redis:8.2.1-alpine
    container_name: auth-redis
    networks:
      - auth

  server:
    image: ghcr.io/goauthentik/server:2026.2.1
    container_name: auth-server
    command: server
    env_file: [../secrets/all.env.dec]
    volumes:
      - media-data:/media
      - ${DOCKER_SOCK}:/var/run/docker.sock
    networks:
      - auth
      - proxy
    depends_on: [postgresql, redis]

  worker:
    image: ghcr.io/goauthentik/server:2026.2.1
    container_name: auth-worker
    command: worker
    env_file: [../secrets/all.env.dec]
    volumes:
      - media-data:/media
      - ${DOCKER_SOCK}:/var/run/docker.sock
    networks:
      - auth
    depends_on: [postgresql, redis]

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/data/postgresql
      o: bind
  media-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/media/data
      o: bind
