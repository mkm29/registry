services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: [../secrets/all.env.dec]
    volumes:
      - minio-data:/data
    networks: [monitoring, proxy]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    env_file: [../secrets/all.env.dec]
    volumes:
      - ../scripts/setup-minio.sh:/setup-minio.sh:ro
    entrypoint: ["/bin/sh", "/setup-minio.sh"]
    networks: [monitoring]
    restart: "no"

volumes:
  minio-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/data/minio
      o: bind
