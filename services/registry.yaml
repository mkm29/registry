services:
  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.15
    container_name: zot-registry
    restart: unless-stopped
    ports:
      - 127.0.0.1:5000:5000
    volumes:
      - "${HOME}/.config/containers/storage:/var/lib/zot"
      - ./config/zot/config.json:/etc/zot/config.json:ro
      - ./certs:/etc/zot/certs:ro
    networks: [registry, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zot.rule=Host(`registry.${DOMAIN}`)"
      - "traefik.http.services.zot.loadbalancer.server.port=5000"
