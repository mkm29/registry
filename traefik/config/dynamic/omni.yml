# Omni (Sidero Labs) - TCP passthrough to external VM
# Omni handles its own TLS termination, so we use TCP passthrough with SNI routing
tcp:
  routers:
    # Main API (port 443)
    omni:
      rule: "HostSNI(`omni.smigula.io`)"
      service: omni
      entryPoints:
        - websecure
      tls:
        passthrough: true
    # SideroLink Machine API (port 8090)
    omni-machine-api:
      rule: "HostSNI(`omni.smigula.io`)"
      service: omni-machine-api
      entryPoints:
        - omni-machine-api
      tls:
        passthrough: true
    # Kubernetes Proxy (port 8100)
    omni-k8s-proxy:
      rule: "HostSNI(`omni.smigula.io`)"
      service: omni-k8s-proxy
      entryPoints:
        - omni-k8s-proxy
      tls:
        passthrough: true
  services:
    omni:
      loadBalancer:
        servers:
          - address: "10.0.0.100:443"
    omni-machine-api:
      loadBalancer:
        servers:
          - address: "10.0.0.100:8090"
    omni-k8s-proxy:
      loadBalancer:
        servers:
          - address: "10.0.0.100:8100"
