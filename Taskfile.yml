version: '3'

vars:
  CRI_BIN: '{{.CRI_BIN | default "docker"}}'
  HOST_IFACE: '{{.HOST_IFACE | default "vmbr0"}}'
  # Dynamic IP Detection
  DETECTED_IP:
    sh: ip -4 addr show {{.HOST_IFACE}} 2>/dev/null | awk '/inet / {print $2}' | cut -d/ -f1 | head -1
  SERVER_IP: '{{.SERVER_IP | default .DETECTED_IP}}'
  # Secrets and Certs
  ENV_FILE: secrets/all.env.dec
  CERT_DIR: certs
  CFSSL_DIR: config/cfssl
  REG_DOMAIN: '{{.REG_DOMAIN | default "registry.smigula.io"}}'
  REG_BASE: '{{.REG_BASE | default "~/.config/containers/storage"}}'

env:
  SERVER_IP: '{{.SERVER_IP}}'
  CRI_BIN: '{{.CRI_BIN}}'

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # --- [0] Preflight Checks ---
  preflight:
    desc: Verify all required tools, files, and directories
    silent: true
    cmds:
      - |
        err=0

        # --- Required binaries ---
        for bin in {{.CRI_BIN}} sops age cfssl cfssljson curl jq; do
          if command -v "$bin" >/dev/null 2>&1; then
            printf '  ✓ %s (%s)\n' "$bin" "$(command -v "$bin")"
          else
            printf '  ✗ %s not found\n' "$bin"
            err=1
          fi
        done

        # --- Compose plugin ---
        if {{.CRI_BIN}} compose version >/dev/null 2>&1; then
          printf '  ✓ %s compose plugin\n' "{{.CRI_BIN}}"
        else
          printf '  ✗ %s compose plugin not available\n' "{{.CRI_BIN}}"
          err=1
        fi

        # --- AGE key ---
        age_key="${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"
        if [ -f "$age_key" ]; then
          printf '  ✓ AGE key (%s)\n' "$age_key"
        else
          printf '  ✗ AGE key not found at %s\n' "$age_key"
          err=1
        fi

        # --- Project files ---
        for f in compose.yaml .env .sops.yaml; do
          if [ -f "$f" ]; then
            printf '  ✓ %s\n' "$f"
          else
            printf '  ✗ %s missing\n' "$f"
            err=1
          fi
        done

        # --- Encrypted secrets ---
        enc_count=$(find secrets -maxdepth 1 -name '*.env.enc' 2>/dev/null | wc -l)
        if [ "$enc_count" -gt 0 ]; then
          printf '  ✓ %d encrypted secret file(s) in secrets/\n' "$enc_count"
        else
          printf '  ⚠ No .env.enc files found in secrets/\n'
        fi

        # --- cfssl configs ---
        for f in {{.CFSSL_DIR}}/ca.json {{.CFSSL_DIR}}/int-ca.json {{.CFSSL_DIR}}/cfssl.json {{.CFSSL_DIR}}/registry.json; do
          if [ -f "$f" ]; then
            printf '  ✓ %s\n' "$f"
          else
            printf '  ✗ %s missing\n' "$f"
            err=1
          fi
        done

        # --- Data directories ---
        for d in /mnt/media /mnt/media/data /mnt/media/monitoring; do
          if [ -d "$d" ]; then
            if [ -w "$d" ]; then
              printf '  ✓ %s (writable)\n' "$d"
            else
              printf '  ⚠ %s exists but not writable (run: task init)\n' "$d"
            fi
          else
            printf '  ⚠ %s does not exist (run: task init)\n' "$d"
          fi
        done

        # --- Unprivileged port start (required for binding port 443) ---
        port_start=$(cat /proc/sys/net/ipv4/ip_unprivileged_port_start 2>/dev/null)
        if [ -n "$port_start" ] && [ "$port_start" -le 443 ]; then
          printf '  ✓ ip_unprivileged_port_start=%s\n' "$port_start"
        else
          printf '  ✗ ip_unprivileged_port_start=%s (must be ≤443)\n' "${port_start:-unknown}"
          printf '    Fix: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443\n'
          printf '    Persist: echo "net.ipv4.ip_unprivileged_port_start=443" | sudo tee /etc/sysctl.d/99-unprivileged-ports.conf\n'
          err=1
        fi

        # --- Server IP ---
        if [ -n "{{.SERVER_IP}}" ]; then
          printf '  ✓ Server IP: %s\n' "{{.SERVER_IP}}"
        else
          printf '  ⚠ Could not detect server IP (set SERVER_IP or HOST_IFACE)\n'
        fi

        # --- Summary ---
        echo ""
        if [ "$err" -eq 0 ]; then
          echo "Preflight passed. Ready to run: task init && task up"
        else
          echo "Preflight failed. Install missing dependencies before proceeding."
          exit 1
        fi

  # --- [1] Secret Management ---
  secrets:decrypt:
    desc: Decrypt all secret files in the secrets directory
    cmds:
      - |
        for f in secrets/.*.env.enc secrets/*.env.enc; do
          [ -f "$f" ] || continue
          sops -d "$f" > "${f%.enc}.dec"
        done

  secrets:collect:
    desc: Aggregate all decrypted env files into one master file
    deps: [secrets:decrypt]
    cmds:
      - echo "# Generated Master Secret File" > {{.ENV_FILE}}
      - |
        for f in secrets/.*.env.dec secrets/*.env.dec; do
          [ -f "$f" ] || continue
          if [ "$f" != "{{.ENV_FILE}}" ]; then
            echo "## Source: $f" >> {{.ENV_FILE}}
            cat "$f" >> {{.ENV_FILE}}
          fi
        done
    generates: [ "{{.ENV_FILE}}" ]

  # --- [2] Certificate Management (PKI) ---
  certs:all:
    desc: Generate full PKI chain (CA -> Intermediate -> Registry)
    cmds:
      - mkdir -p {{.CERT_DIR}}
      - cfssl gencert -initca {{.CFSSL_DIR}}/ca.json | cfssljson -bare {{.CERT_DIR}}/ca
      - cfssl gencert -initca {{.CFSSL_DIR}}/int-ca.json | cfssljson -bare {{.CERT_DIR}}/int
      - cfssl sign -ca {{.CERT_DIR}}/ca.pem -ca-key {{.CERT_DIR}}/ca-key.pem -config {{.CFSSL_DIR}}/cfssl.json -profile intermediate_ca {{.CERT_DIR}}/int.csr | cfssljson -bare {{.CERT_DIR}}/int
      - cfssl gencert -ca {{.CERT_DIR}}/int.pem -ca-key {{.CERT_DIR}}/int-key.pem -config {{.CFSSL_DIR}}/cfssl.json -profile=server {{.CFSSL_DIR}}/registry.json | cfssljson -bare {{.CERT_DIR}}/server

  trust-ca:
    desc: Trust local CA for pulls via loopback
    deps: [certs:all]
    cmds:
      - mkdir -p ~/.config/containers/certs.d/{{.REG_DOMAIN}}:5000
      - cp {{.CERT_DIR}}/ca.pem ~/.config/containers/certs.d/{{.REG_DOMAIN}}:5000/ca.crt

  # --- [3] Infrastructure Lifecycle ---
  init:
    desc: Full environment initialization
    cmds:
      - task: preflight
      - task: init:dirs
      - task: init:networks
      - task: secrets:collect
      - task: trust-ca

  init:dirs:
    internal: true
    cmds:
      - sudo mkdir -p /mnt/media/{data/{config/{radarr,sonarr,plex,recyclarr},postgresql,torrents,media,grafana,minio},monitoring/{logs/{loki,traefik},metrics,traces}}
      - mkdir -p {{.REG_BASE}}
      - sudo chown -R 1000:1000 /mnt/media
      - sudo chmod -R 775 /mnt/media

  init:networks:
    internal: true
    cmds:
      - |
        for net in traefik_net monitoring_net registry_net; do
          docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
        done

  up:
    desc: Deploy the complete infrastructure sequentially
    deps: [init]
    cmds:
      - "{{.CRI_BIN}} compose up -d minio minio-setup"
      - until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done
      - "{{.CRI_BIN}} compose up -d --remove-orphans"
      - echo "Infrastructure deployed on {{.SERVER_IP}}"

  down:
    desc: Full teardown and secret purge
    cmds:
      - "{{.CRI_BIN}} compose down"
      - rm -f secrets/*.dec

  # --- [4] Registry Utilities ---
  registry:list:
    desc: List all images cached in the local registry
    cmds:
      - curl -sk https://127.0.0.1:5000/v2/_catalog | jq .

  # --- Recyclarr Utilities ---
  recyclarr:sync:
    desc: Manually trigger a Recyclarr sync
    cmds:
      - "{{.CRI_BIN}} exec recyclarr recyclarr sync"

  recyclarr:dry-run:
    desc: Run a Recyclarr sync preview (no changes)
    cmds:
      - "{{.CRI_BIN}} exec recyclarr recyclarr sync --preview"

  # --- [5] General Utilities ---
  logs:
    desc: Follow logs for a service (Usage - task logs SERVICE=radarr)
    cmds:
      - "{{.CRI_BIN}} logs -f {{.SERVICE}}"

  shell:
    desc: Shell into container (Usage - task shell SERVICE=sonarr)
    cmds:
      - "{{.CRI_BIN}} exec -it {{.SERVICE}} /bin/sh"
